# 공공 GitLab Pages 배포 — main에 올라오면 앱을 빌드해 웹 주소로 띄운다.
# 결과물은 정적 파일뿐이다(서버·외부 요청 없음). vite.config.ts의 base './' 덕분에 어느 하위 주소에서도 뜬다.
pages:
  image: node:22
  stage: deploy
  script:
    - npm ci
    - npm run build
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
